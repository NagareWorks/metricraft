name: CI

on:
  push:
    branches: [main, master, develop, feature-rust-migrate, 'release/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-checks
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_TERM_COLOR: always

jobs:
  approve:
    name: Maintainer approval
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    environment: ci-review
    steps:
      - run: echo "A maintainer approved this workflow."

  format-and-tooling:
    needs: approve
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.3'
          cache: false
      - name: Validate workflow definitions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - run: python -m unittest discover -s scripts/tests -v

  python:
    needs: approve
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/metricraft/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install -e "python/metricraft[dev]"
      - name: Complete Python regression
        run: python scripts/dev.py tests
      - name: Offline examples
        if: always()
        run: python scripts/dev.py smoke

  conformance:
    needs: approve
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.3'
          cache-dependency-path: tests/conformance/metricsql/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned upstream backends and parser
        shell: bash
        run: |
          curl -fLsS https://github.com/prometheus/prometheus/releases/download/v3.15.0/prometheus-3.15.0.linux-amd64.tar.gz -o "$RUNNER_TEMP/prometheus.tar.gz"
          tar -xzf "$RUNNER_TEMP/prometheus.tar.gz" -C "$RUNNER_TEMP" prometheus-3.15.0.linux-amd64/promtool prometheus-3.15.0.linux-amd64/prometheus
          echo "$RUNNER_TEMP/prometheus-3.15.0.linux-amd64" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/victoria-metrics"
          cd "$RUNNER_TEMP/victoria-metrics"
          curl -fLsS https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/v1.153.0/victoria-metrics-linux-amd64-v1.153.0.tar.gz -O
          curl -fLsS https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/v1.153.0/victoria-metrics-linux-amd64-v1.153.0_checksums.txt -o checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf victoria-metrics-linux-amd64-v1.153.0.tar.gz
          sha256sum --check --ignore-missing checksums.txt
          echo "$RUNNER_TEMP/victoria-metrics" >> "$GITHUB_PATH"
      - run: python -m pip install -e "python/metricraft[dev]"
      - run: python scripts/dev.py conformance
      - name: Check evaluated results through the SDK client
        run: |
          export METRICRAFT_NATIVE_LIB="$GITHUB_WORKSPACE/target/debug/libmetricraft_ffi.so"
          python scripts/check_backend_results.py --output "$RUNNER_TEMP/backend-results"
      - name: Publish backend result summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/backend-results/summary.md" ]; then
            cat "$RUNNER_TEMP/backend-results/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metricraft-backend-results
          path: |
            ${{ runner.temp }}/backend-results/*.json
            ${{ runner.temp }}/backend-results/*.md
            ${{ runner.temp }}/backend-results/*.log
            ${{ runner.temp }}/backend-results/*.om
          if-no-files-found: warn
          retention-days: 30

  packages:
    needs: [format-and-tooling, python, conformance]
    uses: ./.github/workflows/packages.yml

  required-checks:
    needs: [approve, format-and-tooling, python, conformance, packages]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Enforce all required CI paths
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['NEEDS_JSON'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failed:
              raise SystemExit('Required checks did not succeed: ' + str(failed))
          print('All required checks passed.')
          PY
