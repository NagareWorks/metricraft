name: Upstream compatibility matrix
run-name: >-
  Upstream compatibility · ${{ github.event.issue.number && format('PR #{0}', github.event.issue.number) || github.ref_name }}

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  request:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/ci run'))
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      repository: ${{ steps.resolve.outputs.repository }}
      pr: ${{ steps.resolve.outputs.pr }}
    steps:
      # issue_comment uses the default branch, never the PR's command handler.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v8
        id: resolve
        with:
          script: |
            const resolve = require('./.github/scripts/ci-command.cjs');
            const target = await resolve({ github, context });
            if (!target) {
              await core.summary.addRaw('Use `/ci run` or `/ci run compatibility` in a new PR conversation comment.').write();
              return;
            }
            for (const [key, value] of Object.entries(target)) core.setOutput(key, value);
            await core.summary
              .addHeading('Upstream compatibility request')
              .addTable([
                ['Source repository', target.repository],
                ['Tested commit', target.sha],
                ['Pull request', target.pr || 'Manual dispatch'],
              ]).write();

  upstream-matrix:
    needs: request
    if: needs.request.outputs.sha != ''
    # Only accepted requests can supersede a run; comments on other PRs cannot.
    concurrency:
      group: compatibility-${{ needs.request.outputs.pr || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ needs.request.outputs.repository }}
          ref: ${{ needs.request.outputs.sha }}
          persist-credentials: false
      - name: Record tested source
        env:
          SOURCE_REPOSITORY: ${{ needs.request.outputs.repository }}
          SOURCE_SHA: ${{ needs.request.outputs.sha }}
          SOURCE_PR: ${{ needs.request.outputs.pr }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/compatibility"
          printf 'Repository: %s\nCommit: %s\nPR: %s\n' "$SOURCE_REPOSITORY" "$SOURCE_SHA" "$SOURCE_PR" | tee "$RUNNER_TEMP/compatibility/source.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.3'
          # PR code must not populate caches under the default branch's scope.
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Set build output directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/metricraft-target" >> "$GITHUB_ENV"
      - name: Install pinned PromQL oracle
        run: |
          curl -fLsS https://github.com/prometheus/prometheus/releases/download/v3.15.0/prometheus-3.15.0.linux-amd64.tar.gz -o "$RUNNER_TEMP/prometheus.tar.gz"
          tar -xzf "$RUNNER_TEMP/prometheus.tar.gz" -C "$RUNNER_TEMP" prometheus-3.15.0.linux-amd64/promtool prometheus-3.15.0.linux-amd64/prometheus
          echo "$RUNNER_TEMP/prometheus-3.15.0.linux-amd64" >> "$GITHUB_PATH"
      - name: Install pinned MetricsQL backend
        run: |
          mkdir -p "$RUNNER_TEMP/victoria-metrics"
          curl -fLsS https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/v1.153.0/victoria-metrics-linux-amd64-v1.153.0.tar.gz -o "$RUNNER_TEMP/victoria-metrics.tar.gz"
          tar -xzf "$RUNNER_TEMP/victoria-metrics.tar.gz" -C "$RUNNER_TEMP/victoria-metrics"
          echo "$RUNNER_TEMP/victoria-metrics" >> "$GITHUB_PATH"
      - run: python -m pip install .
      - run: cargo build --workspace --release --locked
      - run: echo "METRICRAFT_NATIVE_LIB=$CARGO_TARGET_DIR/release/libmetricraft_ffi.so" >> "$GITHUB_ENV"
      - name: Discover upstream capabilities and check compatibility
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/compatibility"
          python scripts/compatibility/check.py --output "$RUNNER_TEMP/compatibility" 2>&1 | tee "$RUNNER_TEMP/compatibility/run.log"
      - name: Check catalog execution and expected backend values
        run: python scripts/check_backend_results.py --matrix "$RUNNER_TEMP/compatibility/matrix.json" --output "$RUNNER_TEMP/backend-acceptance"
      - name: Publish compatibility summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/compatibility/summary.md" ]; then
            cat "$RUNNER_TEMP/compatibility/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Compatibility report could not be generated. See the failed step and available artifact logs." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/backend-acceptance/summary.md" ]; then
            cat "$RUNNER_TEMP/backend-acceptance/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload complete matrix and source provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metricraft-upstream-compatibility
          path: |
            ${{ runner.temp }}/compatibility
            ${{ runner.temp }}/backend-acceptance/*.json
            ${{ runner.temp }}/backend-acceptance/*.md
            ${{ runner.temp }}/backend-acceptance/*.log
            ${{ runner.temp }}/backend-acceptance/*.om
          if-no-files-found: warn
          retention-days: 14
