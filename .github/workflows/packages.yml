name: Packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native-wheel:
    name: Native wheel (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || null }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-22.04
            container: quay.io/pypa/manylinux_2_28_x86_64:latest
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Git provenance in the container
        if: runner.os == 'Linux'
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          # checkout's temporary Git config is not inherited by build subprocesses.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_COMMIT"
      - uses: actions/setup-python@v6
        if: runner.os != 'Linux'
        with:
          python-version: '3.11'
      - name: Select manylinux Python
        if: runner.os == 'Linux'
        run: echo /opt/python/cp311-cp311/bin >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test native core and ABI on the target platform
        run: cargo test --workspace --locked --target ${{ matrix.target }}
      - name: Build native wheel from the same source commit
        run: |
          python -m pip install build
          python -m build --wheel . --outdir artifacts/bundled
      - name: Repair and check Linux runtime dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          auditwheel repair --plat manylinux_2_28_x86_64 --wheel-dir artifacts/dist artifacts/bundled/*.whl
      - name: Stage Windows and macOS distribution
        if: runner.os != 'Linux'
        shell: bash
        run: |
          mkdir -p artifacts/dist
          cp artifacts/bundled/*.whl artifacts/dist/
      - name: Verify packaged native library and source identity
        run: python scripts/check_native_wheel.py artifacts/dist --source-commit ${{ github.sha }}
      - name: Test installed wheel without checkout or external library fallback
        run: python scripts/check_python_package.py artifacts/dist --require-bundled-native
      - uses: actions/upload-artifact@v6
        with:
          name: metricraft-dist-${{ matrix.name }}
          path: artifacts/dist/*.whl
          if-no-files-found: error
          retention-days: 14

  typing:
    needs: native-wheel
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v7
        with:
          name: metricraft-dist-linux-x86_64
          path: artifacts/dist
      - run: python -m pip install "mypy>=1.14" pyright
      - name: Check the built wheel as a downstream Python application
        shell: bash
        run: python scripts/check_python_typing.py artifacts/dist/*.whl --pyright

  sdist:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install build twine
      - name: Build complete source distribution
        run: python -m build --sdist . --outdir artifacts/dist
      - run: python -m twine check --strict artifacts/dist/*
      - name: Build and install from the sdist without checkout access
        run: python scripts/check_sdist.py artifacts/dist --source-commit ${{ github.sha }}
      - uses: actions/upload-artifact@v6
        with:
          name: metricraft-dist-sdist
          path: artifacts/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
