name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish validated artifacts (requires selecting an existing v tag)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: metricraft-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-source:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require a tag for publication
        if: github.event_name == 'push' || inputs.publish
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          case "$RELEASE_REF" in
            refs/tags/v*) ;;
            *) echo 'Select an existing v tag before publishing.'; exit 1 ;;
          esac

  ci:
    needs: validate-source
    uses: ./.github/workflows/ci.yml

  publish:
    environment: release
    needs: ci
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v7
        with:
          pattern: metricraft-dist-*
          path: dist
          merge-multiple: true
      - run: python -m pip install twine
      - name: Recheck validated artifacts before publication
        run: |
          python scripts/check_native_wheel.py dist --source-commit ${{ github.sha }}
          python -m twine check --strict dist/*
      - name: Validate package version against release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib
          from packaging.utils import parse_wheel_filename, parse_sdist_filename
          from packaging.version import Version
          expected = Version(os.environ['RELEASE_TAG'].removeprefix('v'))
          for path in pathlib.Path('dist').iterdir():
              info = parse_wheel_filename(path.name) if path.suffix == '.whl' else parse_sdist_filename(path.name)
              if info[1] != expected:
                  raise SystemExit(f'{path.name}: version does not match release tag')
          PY
      - name: Publish the validated distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN || secrets.PYPI_PASSWORD }}
      - name: Publish GitHub release artifacts
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'dev') }}
          files: |
            dist/*.whl
            dist/*.tar.gz
