[package]
name = "metricraft-playground"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
metricraft-core = { path = "../../crates/metricraft-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.122"

[profile.release]
opt-level = "s"
lto = true
strip = true
